name: Build Kext

on:
  push:
    paths:
      - 'kext/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose toolchain
        run: |
          {
            echo "=== xcode-select ==="
            xcode-select -p
            echo "=== xcodebuild ==="
            xcodebuild -version 2>&1 || true
            echo "=== SDK ==="
            SDK=$(xcrun --show-sdk-path)
            echo "SDK=$SDK"
            echo "=== Kernel.framework 是否存在 ==="
            ls -d "$SDK/System/Library/Frameworks/Kernel.framework" 2>&1 || echo "NOT FOUND"
            echo "=== Headers ==="
            ls "$SDK/System/Library/Frameworks/Kernel.framework/Headers" 2>&1 | head -30 || true
            echo "=== IOKit 头 ==="
            ls "$SDK/System/Library/Frameworks/Kernel.framework/Headers/IOKit" 2>&1 | head -20 || true
            echo "=== clang 版本 ==="
            clang++ --version
            echo "=== 是否支持 -fapple-kext ==="
            echo 'int main(){return 0;}' > /tmp/t.cpp
            clang++ -fapple-kext -c /tmp/t.cpp -o /tmp/t.o 2>&1 && echo "SUPPORTED" || echo "NOT SUPPORTED"
          } 2>&1 | tee diag.log

      - name: Compile
        id: compile
        run: |
          set -o pipefail
          K=AMDProbe
          mkdir -p build
          SDK=$(xcrun --show-sdk-path)
          KERNEL_HDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"

          {
            echo "=== KERNEL_HDR=$KERNEL_HDR ==="
            clang++ \
              -arch x86_64 -std=c++17 -mkernel -fapple-kext \
              -fno-rtti -fno-exceptions -fno-builtin -fno-common -nostdinc++ \
              -D__KERNEL__ -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
              -I"$KERNEL_HDR" -isystem "$SDK/usr/include" \
              -O2 -Wall \
              -c "kext/$K/$K.cpp" -o "build/$K.o"
            echo "EXIT=$?"
          } 2>&1 | tee compile.log

          if [ ! -f "build/$K.o" ]; then
            echo "::error::编译未生成目标文件"
            exit 1
          fi
          file "build/$K.o" | tee -a compile.log

      - name: Link
        run: |
          set -o pipefail
          K=AMDProbe
          OUT="build/$K.kext"
          mkdir -p "$OUT/Contents/MacOS"
          {
            clang++ -arch x86_64 -mkernel -nostdlib \
              -Wl,-kext -Wl,-r \
              "build/$K.o" -o "$OUT/Contents/MacOS/$K"
          } 2>&1 | tee link.log || true
          cp "kext/$K/Info.plist" "$OUT/Contents/Info.plist"
          file "$OUT/Contents/MacOS/$K" 2>&1 | tee -a link.log || true

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            diag.log
            compile.log
            link.log
          if-no-files-found: warn

      - name: Upload kext (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMDProbe-kext
          path: build/AMDProbe.kext
          if-no-files-found: warn
