name: Build Kext

on:
  push:
    paths:
      - 'kext/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Build kext
        run: |
          set -euo pipefail
          KEXT_NAME="AMDProbe"
          SRC_DIR="kext/${KEXT_NAME}"
          OUT="build/${KEXT_NAME}.kext"
          mkdir -p "${OUT}/Contents/MacOS"

          SDK=$(xcrun --show-sdk-path)
          echo "SDK = ${SDK}"

          # 编译成 kext 用的可执行文件
          # -fapple-kext        : 使用 kext ABI
          # -mkernel            : 内核模式
          # -fno-rtti/-fno-exceptions : kext 不支持
          # -fno-builtin        : 避免与内核符号冲突
          clang++ \
            -arch x86_64 \
            -std=c++17 \
            -mkernel \
            -fapple-kext \
            -fno-rtti \
            -fno-exceptions \
            -fno-builtin \
            -fno-common \
            -nostdinc++ \
            -D__KERNEL__ \
            -DKERNEL \
            -DKERNEL_PRIVATE \
            -DDRIVER_PRIVATE \
            -DAPPLE \
            -DNeXT \
            -I"${SDK}/System/Library/Frameworks/Kernel.framework/Headers" \
            -isystem "${SDK}/usr/include" \
            -O2 \
            -c "${SRC_DIR}/${KEXT_NAME}.cpp" \
            -o "${OUT}/Contents/MacOS/${KEXT_NAME}" \
            -Wl,-kext -Wl,-r

          cp "${SRC_DIR}/Info.plist" "${OUT}/Contents/Info.plist"

          echo "--- 产物 ---"
          find "${OUT}" -type f -exec ls -l {} \;
          file "${OUT}/Contents/MacOS/${KEXT_NAME}"

      - name: Package
        run: |
          cd build
          zip -r -y AMDProbe.kext.zip AMDProbe.kext
          ls -l AMDProbe.kext.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AMDProbe-kext
          path: build/AMDProbe.kext.zip
          if-no-files-found: error
