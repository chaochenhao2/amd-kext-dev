name: Build Kext

on:
  push:
    paths:
      - 'kext/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          SDK=$(xcrun --show-sdk-path)
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Compile
        run: |
          set -euo pipefail
          K=AMDProbe
          mkdir -p build
          KERNEL_HDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          clang++ \
            -arch x86_64 -std=c++17 -mkernel -fapple-kext \
            -fno-rtti -fno-exceptions -fno-builtin -fno-common -nostdinc++ \
            -D__KERNEL__ -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -I"$KERNEL_HDR" -isystem "$SDK/usr/include" \
            -O2 -Wall \
            -c "kext/$K/$K.cpp" -o "build/$K.o"
          file "build/$K.o"

      - name: Link
        run: |
          set -euo pipefail
          K=AMDProbe
          OUT="build/$K.kext"
          mkdir -p "$OUT/Contents/MacOS"
          # kext 必须链接成 MH_BUNDLE（不是 OBJECT，也不是 MH_DYLIB）
          #   -bundle                     生成 MH_BUNDLE
          #   -undefined dynamic_lookup    内核符号在加载时解析
          #   -Wl,-kext                   打上 kext 标记
          clang++ -arch x86_64 -mkernel \
            -bundle -undefined dynamic_lookup \
            -Wl,-kext \
            -Wl,-no_implicit_dylibs \
            "build/$K.o" -o "$OUT/Contents/MacOS/$K"
          cp "kext/$K/Info.plist" "$OUT/Contents/Info.plist"
          echo "=== 链接结果 ==="
          file "$OUT/Contents/MacOS/$K"

      - name: Verify
        run: |
          set -euo pipefail
          K=AMDProbe
          BIN="build/$K.kext/Contents/MacOS/$K"
          echo "=== file ==="
          file "$BIN"
          echo "=== lipo ==="
          lipo -info "$BIN" || true
          echo "=== plist ==="
          plutil -lint "build/$K.kext/Contents/Info.plist"
          echo "=== undefined symbols ==="
          nm -u "$BIN" | head -40 || true
          echo "=== kext bundle check ==="
          # Mach-O filetype: 8 = MH_BUNDLE, 11 = MH_KEXT_BUNDLE, 1 = MH_OBJECT
          MAGIC=$(xxd -p -l 4 "$BIN")
          FT=$(xxd -s 12 -l 4 -e "$BIN" | awk '{print strtonum("0x"$2)}')
          echo "magic=$MAGIC  filetype=$FT"
          if [ "$FT" != "8" ] && [ "$FT" != "11" ]; then
            echo "::error::产物不是 MH_BUNDLE/MH_KEXT_BUNDLE (filetype=$FT)。kext 无法被加载。"
            file "$BIN"
            exit 1
          fi
          echo "OK: Mach-O bundle (filetype=$FT)"

      - name: Push artifacts to branch
        run: |
          set -euo pipefail
          K=AMDProbe
          mkdir -p /tmp/out
          cp -R "build/$K.kext" /tmp/out/
          plutil -lint "/tmp/out/$K.kext/Contents/Info.plist" > /tmp/out/plist-lint.txt 2>&1 || true
          file "/tmp/out/$K.kext/Contents/MacOS/$K" > /tmp/out/file-info.txt 2>&1 || true
          lipo -info "/tmp/out/$K.kext/Contents/MacOS/$K" > /tmp/out/lipo-info.txt 2>&1 || true
          nm -u "/tmp/out/$K.kext/Contents/MacOS/$K" > /tmp/out/undefined-symbols.txt 2>&1 || true
          echo "commit=$GITHUB_SHA" > /tmp/out/build-info.txt
          date -u >> /tmp/out/build-info.txt

          cd /tmp/out
          git init -b artifacts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AMDProbe-kext
          path: build/AMDProbe.kext
          if-no-files-found: warn
