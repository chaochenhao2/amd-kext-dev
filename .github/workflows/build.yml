name: Build Kext

on:
  push:
    paths:
      - 'kext/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          SDK=$(xcrun --show-sdk-path)
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "SDK = $SDK"
          echo "--- Kernel headers ---"
          ls "$SDK/System/Library/Frameworks/Kernel.framework/Headers" | head

      - name: Compile (stage 1)
        run: |
          set -euxo pipefail
          K=AMDProbe
          mkdir -p build
          KERNEL_HDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"

          clang++ \
            -arch x86_64 -std=c++17 -mkernel -fapple-kext \
            -fno-rtti -fno-exceptions -fno-builtin -fno-common -nostdinc++ \
            -D__KERNEL__ -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
            -I"$KERNEL_HDR" -isystem "$SDK/usr/include" \
            -O2 -Wall \
            -c "kext/$K/$K.cpp" -o "build/$K.o"

          echo "--- object ---"
          file "build/$K.o"
          ls -l "build/$K.o"

      - name: Link (stage 2)
        run: |
          set -euxo pipefail
          K=AMDProbe
          OUT="build/$K.kext"
          mkdir -p "$OUT/Contents/MacOS"

          # kext 链接：-r 保留重定位，-kext 标记为 kext bundle
          clang++ -arch x86_64 -mkernel -nostdlib \
            -Wl,-kext -Wl,-r -Wl,-nostdlib \
            "build/$K.o" -o "$OUT/Contents/MacOS/$K"

          cp "kext/$K/Info.plist" "$OUT/Contents/Info.plist"

          echo "--- kext binary ---"
          file "$OUT/Contents/MacOS/$K"
          ls -l "$OUT/Contents/MacOS/$K"

      - name: Verify kext bundle
        run: |
          set -euo pipefail
          K=AMDProbe
          BIN="build/$K.kext/Contents/MacOS/$K"

          # 必须是 kext bundle，不是 object / executable
          if ! file "$BIN" | grep -q 'kext bundle'; then
            echo "::error::产物不是 kext bundle"
            file "$BIN"
            exit 1
          fi

          # 架构必须是 x86_64
          if ! lipo -info "$BIN" | grep -q 'x86_64'; then
            echo "::error::架构不是 x86_64"
            lipo -info "$BIN"
            exit 1
          fi

          echo "--- 未解析符号（应指向 com.apple.kpi.*）---"
          nm -u "$BIN" | head -30 || true

          echo "--- Info.plist 校验 ---"
          plutil -lint "build/$K.kext/Contents/Info.plist"

          echo "✅ 验证通过"

      - name: Package
        run: |
          set -euo pipefail
          cd build
          zip -r -y AMDProbe.kext.zip AMDProbe.kext
          unzip -l AMDProbe.kext.zip
          ls -l AMDProbe.kext.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AMDProbe-kext
          path: build/AMDProbe.kext.zip
          if-no-files-found: error
