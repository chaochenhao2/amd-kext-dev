name: Build Kext

on:
  push:
    paths:
      - 'kext/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          SDK=$(xcrun --show-sdk-path)
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          xcodebuild -version
          echo "SDK = $SDK"

      - name: Build all kexts
        run: |
          set -uo pipefail
          mkdir -p build out
          KERNEL_HDR="$SDK/System/Library/Frameworks/Kernel.framework/Headers"
          FAILED=0

          for SRC_DIR in kext/*/; do
            K=$(basename "$SRC_DIR")
            [ -f "kext/$K/$K.cpp" ] || continue
            echo "=================================================="
            echo ">>> Building $K"
            echo "=================================================="

            if ! clang++ \
              -target x86_64-apple-macos12.0 \
              -arch x86_64 -std=c++17 -mkernel -fapple-kext \
              -fno-rtti -fno-exceptions -fno-builtin -fno-common -nostdinc++ \
              -D__KERNEL__ -DKERNEL -DKERNEL_PRIVATE -DDRIVER_PRIVATE -DAPPLE -DNeXT \
              -I"$KERNEL_HDR" -isystem "$SDK/usr/include" \
              -O2 -Wall \
              -c "kext/$K/$K.cpp" -o "build/$K.o"; then
              echo "::error::$K COMPILE FAILED"
              FAILED=1
              continue
            fi

            OUT="out/$K.kext"
            mkdir -p "$OUT/Contents/MacOS"
            # Strip LC_BUILD_VERSION after linking: -mkernel -nostdlib emits it
            # with platform=0/minos=0/sdk=0 (invalid; macOS wants platform=1),
            # and official kexts like Lilu carry no such command at all.
            # Our post-link step removes it so the load-command set matches.
            if ! clang++ \
              -arch x86_64 -mkernel -fapple-kext -nostdlib \
              -Wl,-kext -Wl,-no_deduplicate \
              "build/$K.o" -o "build/$K.raw"; then
              echo "::error::$K LINK FAILED"
              FAILED=1
              continue
            fi

            python3 .github/workflows/strip_build_version.py \
              "build/$K.raw" "$OUT/Contents/MacOS/$K" || {
              echo "::error::$K STRIP FAILED"
              FAILED=1
              continue
            }

            cp "kext/$K/Info.plist" "$OUT/Contents/Info.plist"

            echo "--- $K verification ---"
            file "$OUT/Contents/MacOS/$K"

            # Hard requirement: _kmod_info or the kernel cannot identify the kext.
            if ! nm "$OUT/Contents/MacOS/$K" 2>/dev/null | grep -q "_kmod_info"; then
              echo "::error::$K missing _kmod_info symbol"
              FAILED=1
              continue
            fi
            echo "OK: _kmod_info present"
            FT_HEX=$(xxd -s 12 -l 4 -p "$OUT/Contents/MacOS/$K")
            FT=$(printf "%d" "0x${FT_HEX:6:2}${FT_HEX:4:2}${FT_HEX:2:2}${FT_HEX:0:2}")
            echo "filetype=$FT"
            case "$FT" in
              8|11) echo "OK: Mach-O bundle" ;;
              *) echo "::error::$K not a bundle (filetype=$FT)"; FAILED=1 ;;
            esac
            plutil -lint "$OUT/Contents/Info.plist" || FAILED=1
          done

          echo "=================================================="
          echo "Build summary:"
          ls -la out/ || true
          echo "=================================================="

          if [ $FAILED -ne 0 ]; then
            echo "::error::One or more kexts failed"
            exit 1
          fi

      - name: Collect artifacts
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts
          for d in out/*.kext; do
            [ -d "$d" ] || continue
            K=$(basename "$d" .kext)
            {
              echo "name=$K"
              echo "commit=$GITHUB_SHA"
              date -u
              file "$d/Contents/MacOS/$K" 2>&1 || true
              lipo -info "$d/Contents/MacOS/$K" 2>&1 || true
              nm -u "$d/Contents/MacOS/$K" 2>/dev/null | head -30 || true
            } > "artifacts/$K-build-info.txt"
            cp -R "$d" artifacts/
          done
          ls -laR artifacts/ || true

      - name: Push artifacts to branch
        if: always()
        run: |
          set -uo pipefail
          cd artifacts
          git init -b artifacts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build $GITHUB_SHA" || echo "nothing to commit"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin artifacts || echo "push failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kexts
          path: out/
          if-no-files-found: warn
